# Production stack for the homelab. Reads secrets and service URLs from stack.env
# (copy stack.env.example). See docs/DEPLOY.md for the runbook.
#
# Only two ports are published:
#   17301  frontend (the iPad opens this; /api/* is proxied to the backend)
#   17300  backend API directly (diagnostics, future integrations)
# Postgres and Redis are reachable only on the compose network.
services:
  kyokki-api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "17300:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - stack.env
    environment:
      - DEBUG=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=kyokki_user
      - POSTGRES_DB=kyokki
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - kyokki_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Where the Next.js server proxies /api/* to (compose service name).
        - API_INTERNAL_URL=http://kyokki-api:8000
    ports:
      - "17301:3000"
    networks:
      - kyokki_net
    depends_on:
      - kyokki-api
    restart: unless-stopped

  postgres:
    image: postgres:15
    # POSTGRES_PASSWORD comes from stack.env via env_file (not ${...} interpolation,
    # which Compose would read from the shell or a .env file instead).
    env_file:
      - stack.env
    environment:
      POSTGRES_DB: kyokki
      POSTGRES_USER: kyokki_user
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kyokki_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyokki_user -d kyokki"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - kyokki_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kyokki_net:
    driver: bridge
