[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "B008", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# pytest is configured in backend/pytest.ini, which is where the suite is run from.
# A second copy here shadowed it for anyone running pytest from the repo root, and
# it lacked the marker deselect, so the MinerU and vLLM tests ran against services
# that are usually not up.

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
