services:
  # TODO: Replace with Traefik for proper SSL/routing (per architecture docs)
  # nginx:
  #   build: ./nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./ssl/kyokki.crt:/etc/ssl/certs/kyokki.crt:ro
  #     - ./ssl/kyokki.key:/etc/ssl/private/kyokki.key:ro
  #     - backup_data:/app/backups
  #   networks:
  #     - kyokki_net
  #   depends_on:
  #     - frontend
  #     - kyokki-api

  kyokki-api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Mount entire backend for development
      - ./data:/app/data
      - ./logs:/app/logs
      - ./samples:/app/samples  # Mount samples for testing
    env_file:
      - .env
    networks:
      - kyokki_net
    depends_on:
      - postgres
      - redis

  # Development runs the frontend with `npm run dev` on the host (see docs/DEPLOY.md);
  # the production frontend container lives in docker-compose.prod.yml.

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kyokki
      POSTGRES_USER: kyokki_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kyokki_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - kyokki_net

volumes:
  postgres_data:
  redis_data:
  backup_data:

networks:
  kyokki_net:
    driver: bridge