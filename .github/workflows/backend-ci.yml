name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'pyproject.toml'

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^ruff==' backend/requirements.txt)"

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  type-check:
    name: Type Check with mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run mypy against the committed baseline
        working-directory: backend
        # Known errors live in backend/mypy-baseline.txt, keyed on file and error
        # code. Only new ones fail. H21 empties the baseline and drops the script.
        run: python -m scripts.check_mypy_baseline

      - name: Check the vocabularies against the iPad's types
        working-directory: backend
        # frontend/types/ mirrors backend/app/schemas/ by hand, and nothing checked it:
        # four fields in one month reached the other side only because an unrelated test
        # fixture stopped compiling (H24).
        run: python -m scripts.check_vocabularies

  test:
    name: Test with pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kyokki_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kyokki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: kyokki_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: kyokki_test
      KYOKKI_TEST_REQUIRE_DB: "1"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINERU_BASE_URL: http://192.168.0.94:8008
      LLM_BASE_URL: http://192.168.0.247:9003/v1
      LLM_MODEL: qwen3-8B
      LLM_API_KEY: ollama

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Migrations match models
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      - name: Run pytest with coverage
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Comment test results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('backend/coverage.xml', 'utf8');
            // Extract coverage percentage (simplified)
            const match = coverage.match(/line-rate="([0-9.]+)"/);
            const coveragePercent = match ? (parseFloat(match[1]) * 100).toFixed(1) : 'N/A';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ✅ Backend Tests Passed\n\n📊 Coverage: ${coveragePercent}%`
            });
        continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kyokki_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kyokki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: kyokki_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: kyokki_test
      KYOKKI_TEST_REQUIRE_DB: "1"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINERU_BASE_URL: http://192.168.0.94:8008
      LLM_BASE_URL: http://192.168.0.247:9003/v1
      LLM_MODEL: qwen3-8B
      LLM_API_KEY: ollama

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run integration tests only
        working-directory: backend
        run: pytest tests/integration/ -v
        continue-on-error: true  # Known 3 failing tests from handoff doc

  all-checks-pass:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    if: always()
    steps:
      - name: Check all jobs
        run: |
            if [ "${{ needs.lint.result }}" != "success" ]; then            
              echo "⚠️ Linting had issues (non-blocking for now)"           
            fi                                                              
            if [ "${{ needs.type-check.result }}" != "success" ]; then
              echo "❌ New type errors (see backend/mypy-baseline.txt)"
              exit 1
            fi
            if [ "${{ needs.test.result }}" != "success" ]; then            
              echo "❌ Tests failed"                                        
              exit 1                                                        
            fi                                                              
            echo "✅ All required checks passed!"

