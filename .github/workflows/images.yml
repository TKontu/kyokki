name: Publish images

# Builds the two deployable images and pushes them to GHCR, so the homelab (Portainer)
# deploys docker-compose.prod.yml straight from this repository without building anything.
# Packages must be public once: GitHub -> Packages -> kyokki-backend / kyokki-frontend ->
# Package settings -> Change visibility.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/images.yml'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    name: Validate the production stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compose file parses with only the required variables set
        run: |
          POSTGRES_PASSWORD=ci-check docker compose -f docker-compose.prod.yml config -q
          echo "docker-compose.prod.yml is valid"

      - name: Every stack.env.example key is used by the compose file
        run: |
          missing=0
          while IFS= read -r key; do
            grep -q "\${$key" docker-compose.prod.yml || { echo "missing in compose: $key"; missing=1; }
          done < <(grep -v '^#' stack.env.example | grep '=' | cut -d= -f1)
          exit $missing
