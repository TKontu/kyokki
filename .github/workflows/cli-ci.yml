name: CLI CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'

jobs:
  cli:
    name: Lint, type-check and test the CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'cli/pyproject.toml'

      - name: Install the CLI with its dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e './cli[dev]'

      - name: Run ruff check
        run: ruff check cli/

      - name: Run ruff format check
        run: ruff format --check cli/

      - name: Run mypy (strict)
        run: mypy --config-file cli/pyproject.toml cli/kyokki

      - name: Run pytest
        run: pytest cli/tests -v

      - name: The console script runs
        run: |
          kyokki -h > /dev/null
          set +e
          env -u KYOKKI_URL kyokki stock list
          code=$?
          set -e
          test "$code" -eq 2

      - name: A plain (non-editable) install runs
        run: |
          python -m venv "$RUNNER_TEMP/kyokki-plain"
          "$RUNNER_TEMP/kyokki-plain/bin/pip" install ./cli
          "$RUNNER_TEMP/kyokki-plain/bin/kyokki" -h > /dev/null
